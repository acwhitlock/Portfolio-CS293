<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>About - Amelia Whitlock</title>
        <link href="styles.css" rel="stylesheet">
        <script>
            if (localStorage.getItem('theme') == 'darkmode') {
                document.documentElement.classList.add('darkmode')
            }
        </script>
    </head>
    <body>
        <table style="width: 100%;">
            <tr>
                <th><h1 class="box"><a href="index.html">Amelia Whitlock</a></h1></th>
                <th><h2><a href="projects.html">Projects</a></h2></th>
                <th><h2><a href="contact.html">Contact</a></h2></th>
                <th><h2 id="toggle-dark-mode">Toggle Dark Mode</h2></th>
            </tr>
        </table>
        <table>
            <tr>
                <td style="vertical-align: top;">
                    <h3>Background</h3>
                    <p>I am a second year double majoring in Computer Science and Mathematics.</p>
                    <h3>Free Time</h3>
                    <p>In my free time, I enjoy all sorts of crafts such as:</p>
                    <ul>
                        <li>Crochet</li>
                        <li>Knitting</li>
                        <li>Chainmail</li>
                        <li>Embroidery</li>
                    </ul>
                </td>
                <td>
                    <img src="portfolio_images/chainmail.HEIC" alt="A chainmail rhombus made with metal scales">
                    <img src="portfolio_images/crochet.HEIC" alt="Two crochet amigurumi fighting over a cookie from the Bon">
                    <img src="portfolio_images/knitting.HEIC" alt="A half-knitted sock with a leaf pattern">
                </td>
            </tr>
        </table>
        <footer>
            <p>&copy; 2026</p>
        </footer>
        <script>
            function toggleDarkMode(){
                document.documentElement.classList.toggle('darkmode');
                if (document.documentElement.classList.contains('darkmode')) {
                    localStorage.setItem('theme', 'darkmode');
                } else {
                    localStorage.setItem('theme', 'lightmode');
                }
            }
            document.getElementById('toggle-dark-mode').addEventListener('click', toggleDarkMode);
        </script>
    </body>
</html>
